name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      run-govulncheck: true
      # Profile floor. Never lower; raise as tests are added.
      coverage-min: "90"
      fuzz-time: 10s
      codecov-name: go-s7comm
      go-versions: '["1.26", "1.27"]'
      policy-version: v1.4.1
    secrets: inherit

  # go-ci gates the total; this gates each package (COVER_PKG_MIN).
  coverage-floor:
    name: Per-package coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: make coverage-pkg-check
