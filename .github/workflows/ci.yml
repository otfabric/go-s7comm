name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2.1.0
    with:
      run-govulncheck: true
      # Measured 88.1% in go-ci; the profile floor is 90. Raise as tests are added.
      coverage-min: "88"
      fuzz-time: 10s
      codecov-name: go-s7comm
      go-versions: '["1.23", "1.24", "1.25", "1.26"]'
    secrets: inherit