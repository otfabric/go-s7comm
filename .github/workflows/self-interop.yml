name: Self-interop
run-name: "Self-interop against snap7-interop-otfabric:latest, by @${{ github.actor }} on ${{ github.ref_name }}"

# Manual only. This commit's client against the latest published server of
# go-s7comm itself (ghcr.io/otfabric/snap7-interop-otfabric:latest, from
# otfabric/snap7-interop), with every vendored fixture. The e2e and server
# tests run both sides from one commit; this one finds a change on the wire
# that breaks an earlier release.
#
# Not part of the Interop workflow, which runs against the independent
# references, and never a required check. Nothing is pinned or committed, so
# it cannot ask for a release. A pass is not independent verification
# (INTEROPERABILITY.md).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/otfabric/snap7-interop-otfabric:latest

jobs:
  self-interop:
    name: This commit against snap7-interop-otfabric:latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Pull the image
        run: docker pull "${IMAGE}"

      - name: Versions
        id: versions
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Versions"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| go-s7comm under test | \`${REF}\` at \`${SHA}\` (\`$(git describe --tags --always)\`) |"
            echo "| Go | \`$(go env GOVERSION)\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Image digest | \`${digest}\` |"
            docker run --rm "${IMAGE}" version | jq -r '"| go-s7comm in the image | `\(.upstreamVersion)` at `\(.upstreamRevision)`, independent engine: \(.independentEngine) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        env:
          SNAP_INTEROP_OTFABRIC_IMAGE: ${{ steps.versions.outputs.digest }}
          SNAP_INTEROP_SERVERS: otfabric
        run: |
          set -o pipefail
          GOWORK=off go test -v -tags interop -count=1 -timeout 25m ./interop/ 2>&1 | tee interop.log
          {
            echo "## Result"
            echo
            echo "- $(grep -c -- '--- PASS' interop.log) passed, $(grep -c -- '--- SKIP' interop.log) skipped, $(grep -c -- '--- FAIL' interop.log) failed"
            grep -h 'known difference' interop.log | sed 's/^ *[a-z_]*\.go:[0-9]*: /- /' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
