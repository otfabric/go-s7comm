name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  snap7-interop:
    name: snap7-interop (native + python)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Run interop matrix
        env:
          SNAP_INTEROP_NATIVE_IMAGE: ghcr.io/otfabric/snap-interop-native@sha256:54ce1a50212c85f7070a6898d5f615edfdabf2f6275c4f51e39d239d3c6fc7f6
          SNAP_INTEROP_PYTHON_IMAGE: ghcr.io/otfabric/snap-interop-python@sha256:030caa869c29fd1ec2b2141ae966132d55b9dd5825916a190d1932af30c50faf
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq --filter name=go-s7comm-interop); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore
