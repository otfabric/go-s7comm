# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap7-interop:
    name: snap7-interop (native + python)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Run interop matrix
        env:
          SNAP_INTEROP_NATIVE_IMAGE: ghcr.io/otfabric/snap7-interop-native@sha256:b2ac7b3d0d8cb1dc1ac5d7e465a118eb484a2506ea67b10be6ff7579ac5d5a97
          SNAP_INTEROP_PYTHON_IMAGE: ghcr.io/otfabric/snap7-interop-python@sha256:7b2d7691e6f4ea95af6699025ad31946c542f237af543ccae686f6fe79b5cd5e
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq --filter name=go-s7comm-interop); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore
